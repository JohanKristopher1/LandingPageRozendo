    <!-- Schema JSON-LD: FAQPage — perguntas frequentes sobre taxas bancárias -->

    {
      "@context": "https://schema.org",

      "mainEntity": [
        {
          "@type": "Question",
          "name": "Posso entrar na Justiça contra o banco por taxas indevidas?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. Se o banco cobrou taxas não previstas em contrato, juros acima do permitido ou realizou deduções sem autorização, você tem direito de buscar ressarcimento. O Código de Defesa do Consumidor (CDC) protege clientes bancários contra cobranças abusivas e o escritório Rozendo Advocacia pode auxiliá-lo neste processo."
          }
        },
        {
          "@type": "Question",
          "name": "Quais taxas bancárias podem ser consideradas indevidas?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "São consideradas indevidas: tarifas não previstas em contrato, juros acima do limite legal, cobrança de seguros sem autorização expressa, taxa de cadastro duplicada, juros capitalizados ilegalmente, tarifas de serviços não utilizados e qualquer encargo não informado previamente."
          }
        },
        {
          "@type": "Question",
          "name": "O escritório Rozendo Advocacia atua em Manaus em casos de taxas bancárias?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. O escritório Rozendo Advocacia é especialista em Direito do Consumidor e atua em casos de taxas abusivas e cobranças indevidas de bancos em Manaus e em todo o estado do Amazonas. Entre em contato pelo WhatsApp (92) 9 8529-0505 para uma avaliação do seu caso."
          }
        },
        {
          "@type": "Question",
          "name": "Quanto tempo leva uma ação contra o banco por cobrança indevida?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O prazo varia conforme a complexidade do caso e a via escolhida. Ações no Juizado Especial Cível (Procon) costumam ser resolvidas em 6 a 18 meses. Ações na Justiça Comum podem levar mais tempo. Consulte nosso escritório para uma avaliação detalhada do seu caso."
          }
        },
        {
          "@type": "Question",
          "name": "Quais documentos preciso para entrar com ação contra o banco?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Geralmente são necessários: extratos bancários com as cobranças indevidas, contrato assinado com o banco, comprovante de pagamento das taxas e documentos pessoais (RG, CPF e comprovante de residência). O escritório Rozendo Advocacia orienta o cliente sobre todos os documentos necessários no caso concreto."
          }
        }
      ]
    }
